name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

      - name: Build images
        run: |
          docker build -f Dockerfile.api -t churn-api:latest .
          docker build -f Dockerfile.frontend -t churn-frontend:latest .

